name: Build Hugo Blog

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build site
        run: hugo --minify --cleanDestinationDir --printPathWarnings --printI18nWarnings

      - name: Upload public artifact
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          if-no-files-found: error
